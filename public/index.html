<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>플랜두씨 | 나의 계획과 실행</title><meta name="description" content="계획을 작게 나누고 실행을 기록하며 다음 계획을 준비하는 다이어리"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body class="session-loading">
<aside><a class="brand" href="/"><span class="brand-mark">p.</span> 플랜두씨</a><p class="brand-sub">PLAN · DO · SEE</p><nav aria-label="주 메뉴"><button data-view="plan" class="active">01 <span>내 계획</span></button><button data-view="tasks">02 <span>할 일</span></button><button data-view="do">03 <span>실행 기록</span></button><button data-view="see">04 <span>돌아보기</span></button><button data-view="observe">05 <span>5일 관찰</span></button><button data-view="account">06 <span>내 계정</span></button></nav><div class="aside-bottom"><strong>나의 속도로, 꾸준히.</strong><p>오늘의 작은 실행을 남겨요.</p><button id="export" class="outline">전체 자료 내보내기</button><button id="logout" class="outline">로그아웃</button></div></aside>
<main><div class="notice">내 계획과 기록은 로그인한 내 계정에서만 볼 수 있어요.</div><header><div><p class="eyebrow">MAKE ROOM FOR YOUR PLANS</p><h1 id="page-title">내 계획</h1></div><span id="today"></span></header><div id="message" role="status" aria-live="polite"></div><div class="plan-picker"><label for="plan-select">현재 계획</label><select id="plan-select"></select><button id="reload" class="outline">새로고침</button></div><div id="content"><p>서버에서 기록을 불러오는 중입니다.</p></div></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="outline">닫기</button></div><div id="fields"></div><p id="form-error" role="alert"></p><button type="submit" class="primary" id="save">저장</button></form></dialog>
</body></html>
